[project]
name = "yahoo-fantasy-mcp"
version = "0.1.0"
description = "MCP server that lets Claude read your Yahoo Fantasy league: standings, matchups, rosters, free agents, transactions."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["mcp>=1.2", "httpx>=0.27"]

[project.scripts]
yahoo-fantasy-mcp = "yahoo_fantasy_mcp.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yahoo_fantasy_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
